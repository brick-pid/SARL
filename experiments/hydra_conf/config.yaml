defaults:
  - paths: local
  - algo: grpo
  - model: qwen3_4b_inst
  - checkpoint: base
  - rollout: base
  - eval: base
  - gpu: train_2gpu
  - logging: offline_wandb_tb
  - custom: single
  - optimizer: adam_base
  - sglang: base
  - misc: base
  - _self_


runtime:
  python_executable: python3
  train_entrypoint: train.py
  cleanup_commands:
    - "pkill -9 sglang"
    - "sleep 3"
    - "ray stop --force"
    - "pkill -9 ray"
    - "pkill -9 python"
    - "sleep 3"
    - "pkill -9 ray"
    - "pkill -9 python"
  cleanup_ignore_errors: true
  env_vars:
    WANDB_MODE: offline
    NCCL_NVLS_ENABLE: "0"
    PYTHONBUFFERED: "16"

hydra:
  job:
    name: hydra_runner
    chdir: false
  run:
    dir: ${paths.repo_dir}/experiments/runs/${now:%m%d-%H%M}/${paths.exp_name}
