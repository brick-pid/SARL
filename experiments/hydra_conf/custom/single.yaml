name: single
env_name: alfworld
reward_process: experiments.rewards.post_process_rewards # use null to disable custom reward post-processing
custom_config:
  strategy_schedule:
    - name: single
      enable_subagent: false
      use_single_demo: false
      train_subagent: false
  reward_norm: sample_norm      # sample_norm | episode_norm
  reward_augment: null           # null | pseudo_pos
  max_env_turns: 50
  max_subagent_turns: 10
  env_port_base: 36001
  env_nums: 8
  exp_dir: ${paths.exp_dir}
