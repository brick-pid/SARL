name: stages
env_name: alfworld
reward_process: experiments.rewards.post_process_rewards
custom_config:
  training_stage: 0               # 0 | 1 | 2, where 0: stage0, 1: stage1, 2: stage2 (auto-updated if stage_transitions is set)
  stage_transitions: [100, 150]    # transition to stage 1 at rollout 50, stage 2 at rollout 100
  reward_norm: episode_norm        # sample_norm | episode_norm
  reward_augment: null            # null | pseudo_pos
  max_env_turns: 50
  max_subagent_turns: 10
  env_port_base: 36001
  env_nums: 8
  exp_dir: ${paths.exp_dir}
