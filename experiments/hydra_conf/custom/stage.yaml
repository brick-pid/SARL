name: stages
env_name: alfworld
reward_process: experiments.rewards.post_process_rewards
custom_config:
  strategy_schedule:
    - until_step: 100
      name: single
      enable_subagent: false
      train_subagent: false
    - until_step: 150
      name: mix
      enable_subagent: true
      train_subagent: false
    - name: hierarchy
      enable_subagent: true
      train_subagent: true
  reward_norm: episode_norm        # sample_norm | episode_norm
  reward_augment: null            # null | pseudo_pos
  max_env_turns: 50
  max_subagent_turns: 10
  env_port_base: 36001
  env_nums: 8
  exp_dir: ${paths.exp_dir}
